# cargo-deny policy (review #68). CI runs `cargo deny check` on every push.
# cargo-audit (scripts/security-sweep.sh) stays as the second advisory gate.

[graph]
all-features = false

[advisories]
# RustSec: vulnerabilities fail; unmaintained/unsound surface for review.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with shipping Cairn under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common in large async trees: report, don't block.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
