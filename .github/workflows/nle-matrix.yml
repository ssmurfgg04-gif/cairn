# nle-matrix -- the NLE test matrix, executed where it can be executed.
#
# Round 13 part 2: the H1-H10 rows of docs/design/nle-test-matrix.md need a
# studio box with a human artist (and, for Premiere/Resolve, licensed NLEs
# and GPUs). This workflow runs the subset GitHub Actions CAN prove, on the
# platform the studios actually use (windows-latest):
#
#   windows-nle            two real daemons + a real CfAPI sync root + a real
#                          NLE (headless Blender, bpy) doing open -> scrub ->
#                          save -> reopen through the filter (scripts/
#                          win_nle_matrix.ps1, rows W0-W6). BLOCKING gate.
#   resolve-probe          the empirical answer to "install DaVinci on the
#                          runner": search -> silent install -> launch, one
#                          honest JSON either way. NEVER blocks (the probe's
#                          outcome is data, not a verdict on Cairn).
#   real-timeline-corpus   the pinned real-NLE timeline corpus gate (round 13
#                          part 1's scripts/real_timeline_corpus.py now in
#                          CI, python-otio interop oracle included).
#   premiere-uxp           CONTRACT-DEBT #3 scaffold: the third marker-bridge
#                          surface — a real Premiere Pro 25+ host driving the
#                          UXP panel (crates/cairn-cli/assets/uxp-panel/).
#                          Dispatch-only on a [self-hosted, windows, premiere]
#                          box (a label no runner carries yet — the job
#                          documents intent). Amber until a transcript exists:
#                          docs/nle-matrix-results/premiere-uxp-README.md.
#
# I1 numbers from the windows runner are a BEST-CASE bound (loopback plane +
# NVMe): CI proves the MECHANISM and the local latency budget; WAN RTT is the
# studio leg and stays that way, honestly.
name: nle-matrix

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "scripts/win_nle_matrix.ps1"
      - "scripts/win_nle_stack.ps1"
      - "scripts/win_resolve_probe.ps1"
      - "scripts/real_timeline_corpus.py"
      - "scripts/test_cairn.py"
      - ".github/workflows/nle-matrix.yml"
  pull_request:
    paths:
      - "crates/**"
      - "scripts/win_nle_matrix.ps1"
      - "scripts/win_nle_stack.ps1"
      - "scripts/win_resolve_probe.ps1"
      - "scripts/real_timeline_corpus.py"
      - "scripts/test_cairn.py"
      - ".github/workflows/nle-matrix.yml"
  schedule:
    - cron: "23 4 * * 1" # weekly re-verification (runner images drift)
  workflow_dispatch:
    inputs:
      premiere_project:
        description: "attached project id the premiere-uxp transcript fetches markers for"
        required: false
        default: "premiere-demo"

concurrency:
  group: nle-matrix
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  windows-nle:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: "Build cairn (release: hydration timing wants an optimized binary)"
        run: cargo build --release -p cairn-cli --bin cairn

      - name: Install headless Blender (bpy wheel = Blender as a Python module)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: bpy import smoke
        shell: pwsh
        run: |
          pip install --quiet bpy==5.2.1
          python -c "import bpy; print('bpy', bpy.app.version_string)"

      # `powershell` (5.1, .NET Framework) on purpose: the strictest shell the
      # scripts claim to support -- if the studio box runs 5.1, CI proves 5.1
      - name: The NLE matrix (W0 boot -> W6 tl contract)
        shell: powershell
        run: |
          powershell -File scripts\win_nle_matrix.ps1 -Cairn target\release\cairn.exe -Python python

      - name: Stage stack logs (workspace-relative, so the artifact path is deterministic)
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          Copy-Item "$env:USERPROFILE\cairn-nle\nle\*.log" logs -ErrorAction SilentlyContinue
          Copy-Item "$env:USERPROFILE\cairn-nle\nle\*.log.err" logs -ErrorAction SilentlyContinue
          Get-ChildItem logs -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "staged: $($_.Name)" }

      - name: Job summary
        if: always()
        shell: powershell
        run: |
          $j = "docs\nle-matrix-results\windows-runner-matrix.json"
          if (Test-Path $j) {
            $m = Get-Content $j -Raw | ConvertFrom-Json
            $lines = @("## NLE matrix (windows runner)", "")
            foreach ($row in @($m.rows)) {
              $v = "FAIL"; if ($row.ok) { $v = "PASS" }
              $lines += ("- **{0} {1}** -- {2}" -f $row.row, $v, $row.desc)
            }
            $lines += ""
            $lines += ("I1 cold first-2MiB: {0} ms (best-case: loopback + NVMe) -- full stack through CfAPI" -f $m.metrics.cold_first_2mib_ms)
            if ($m.metrics.conflict_copy_name) { $lines += ("conflict copy: {0}" -f $m.metrics.conflict_copy_name) }
            $lines += ($m.blender_stages | ForEach-Object { "    " + $_ })
            $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            "## NLE matrix (windows runner)`n`nNo results JSON -- the matrix step failed before writing it; see logs." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Upload results + stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nle-matrix-windows
          path: |
            docs/nle-matrix-results/windows-runner-matrix.json
            logs/
          if-no-files-found: warn
          retention-days: 30

  resolve-probe:
    # "the github runners have windows vms or install davinci etc light
    # versions on it" -- answered empirically. Non-blocking: every outcome is
    # data about the RUNNER, not about Cairn.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: DaVinci Resolve probe (search -> install -> launch; outcome recorded either way)
        shell: powershell
        continue-on-error: true
        run: |
          powershell -File scripts\win_resolve_probe.ps1

      - name: Job summary
        if: always()
        shell: powershell
        run: |
          $j = "docs\nle-matrix-results\resolve-probe.json"
          if (Test-Path $j) {
            $m = Get-Content $j -Raw | ConvertFrom-Json
            $lines = @("## DaVinci Resolve probe (windows runner)", "")
            foreach ($prop in $m.steps.PSObject.Properties) {
              $v = "FAIL"; if ($prop.Value.ok) { $v = "OK" }
              $lines += ("- {0}: {1} -- {2}" -f $prop.Name, $v, $prop.Value.detail)
            }
            $lines += ""
            $lines += ("**verdict:** {0}" -f $m.verdict.meaning)
            $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            "## DaVinci Resolve probe (windows runner)`n`nNo probe JSON -- the probe step failed; see logs." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolve-probe
          path: docs/nle-matrix-results/resolve-probe.json
          if-no-files-found: warn
          retention-days: 90

  real-timeline-corpus:
    # Round 13 part 1's gate, now in CI: 18 pinned real-NLE timelines through
    # tl-capture + both merge contracts + recapture + the python-otio interop
    # oracle. Outcome pins fail on drift in BOTH directions.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-otio (the interop oracle)
        run: pip install opentimelineio==0.18.1

      - name: Build cairn
        run: cargo build -p cairn-cli --bin cairn

      - name: The real-NLE timeline corpus gate
        run: |
          python scripts/real_timeline_corpus.py \
            --cairn target/debug/cairn \
            --out docs/nle-matrix-results/real-timeline-corpus.json

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Real-NLE timeline corpus"
            echo ""
            if [ -f docs/nle-matrix-results/real-timeline-corpus.json ]; then
              python - <<'EOF'
          import json
          m = json.load(open("docs/nle-matrix-results/real-timeline-corpus.json"))
          t = m["totals"]
          print(f"**{t['capture_merge_green']}/{t['files']}** files capture+merge green (pinned outcomes)")
          for r in m["results"]:
              mark = "PASS" if r["status"] == "capture+merge" else "REFUSED"
              print(f"- {r['source']}: {mark} ({r.get('capture_ms')} ms capture)")
          EOF
            else
              echo "No results JSON -- the gate failed before writing it; see logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-timeline-corpus
          path: docs/nle-matrix-results/real-timeline-corpus.json
          if-no-files-found: warn
          retention-days: 30

  premiere-uxp:
    # CONTRACT-DEBT #3: the marker bridge has three surfaces (CLI export,
    # HTTP /api/v1/markers, the Premiere UXP panel). Two are verified; the
    # third — a REAL Premiere host driving the panel end-to-end — has never
    # run. This job is the scaffold for that run, honestly amber until a
    # transcript exists: the runner label does not exist yet, the job only
    # fires on a manual dispatch against a box that carries it, and every
    # failure is non-blocking. What green means (the acceptance): the
    # transcript shows the panel fetching markers for the named project and
    # receiving 200 with a parseable FCPXML —
    # docs/nle-matrix-results/premiere-uxp-README.md.
    runs-on: [self-hosted, windows, premiere]
    timeout-minutes: 15
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      # (b) idempotent, read-only probe of the four prerequisites. Best-effort
      # BY DESIGN (exit 0 either way): the transcript is the verdict, not this
      # step — it just echoes, loudly, what must be installed.
      - name: "Probe the UXP runtime (best-effort; see docs/nle-matrix-results/premiere-uxp-README.md)"
        shell: powershell
        run: |
          $missing = @()

          # Premiere Pro 25+ — the host the panel manifest declares (minVersion 25.0.0)
          $pp = Get-ChildItem "$env:ProgramFiles\Adobe" -Filter "Adobe Premiere Pro 2*" `
                -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if ($pp) { Write-Host "premiere: found $($pp.Name)" }
          else { Write-Warning "Adobe Premiere Pro 25+ not found -- install it (licensed) on this runner"; $missing += "premiere" }

          # UXP Developer Tool -- loads the panel in dev mode, no signing needed
          $uxp = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -like "*UXP*" } | Select-Object -First 1
          if ($uxp) { Write-Host "uxp developer tool: found ($($uxp.Name))" }
          else { Write-Warning "UXP Developer Tool not found -- install it from Creative Cloud, then Load crates/cairn-cli/assets/uxp-panel/manifest.json"; $missing += "uxp-dev-tool" }

          # the panel, copied to Premiere's UXP extensions dir (panel README step 1)
          $panel = Join-Path $env:APPDATA "Adobe\Adobe Premiere Pro\extensions\cairn-markers\manifest.json"
          if (Test-Path $panel) { Write-Host "panel: installed ($panel)" }
          else { Write-Warning "cairn-markers panel not installed at $panel -- copy crates/cairn-cli/assets/uxp-panel/ there (or Load via the UXP Developer Tool)"; $missing += "panel" }

          # the loopback gateway the panel reads (panel.js API const; ADR-0009 posture)
          try {
            $null = Invoke-WebRequest -Uri "http://127.0.0.1:17778/" -UseBasicParsing -TimeoutSec 5
            Write-Host "gateway: http://127.0.0.1:17778 reachable (daemon up)"
          } catch {
            Write-Warning "daemon gateway not reachable on 127.0.0.1:17778 -- start it: cairn daemon"; $missing += "daemon"
          }

          foreach ($tool in @("cairn", "python")) {
            if (Get-Command $tool -ErrorAction SilentlyContinue) { Write-Host "$tool on PATH: yes" }
            else { Write-Warning "$tool not on PATH -- the collector needs it"; $missing += $tool }
          }

          if ($missing.Count -gt 0) {
            Write-Output ("::warning::premiere-uxp prerequisites missing: " + ($missing -join ", ") + " -- setup checklist: docs/nle-matrix-results/premiere-uxp-README.md")
          }
          exit 0

      # (c) the transcript. The collector replays the panel's exact markers
      # fetch (200 + parseable FCPXML = the headlessly provable half) and
      # records the human half (P1/P2/P3, --confirm-row on the box) as
      # UNCONFIRMED: a CI run confirms nothing, so the verdict is honestly
      # "pending-first-real-host-run" (exit 3) until an operator drives the
      # panel per the README. Non-blocking either way (continue-on-error).
      - name: Collect the premiere-uxp transcript
        shell: powershell
        run: |
          python scripts/nle_matrix_collect.py --host premiere --nle premiere `
            --project "${{ inputs.premiere_project }}" `
            --out docs/nle-matrix-results/premiere-uxp/transcript.json

      # (d) the transcript is the artifact the studio's first real host run
      # sends back; landing it in docs/nle-matrix-results/ turns the cell green
      - name: Upload transcript (premiere-uxp-transcript)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premiere-uxp-transcript
          path: docs/nle-matrix-results/premiere-uxp/transcript.json
          if-no-files-found: warn
          retention-days: 90
