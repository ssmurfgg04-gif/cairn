# WO6-invariants: Kani bounded model checking, SHARDED — one proof harness
# per runner (the proofs are independent; BLAKE3-heavy harnesses get their
# own shard). Local sandboxes are CPU-starved: the exhaustive proofs belong
# on CI.
name: kani
on:
  push:
    branches: [main]
    paths: ["crates/cairn-core/**", "crates/cairn-tl/**", ".github/workflows/kani.yml"]
  pull_request:
    paths: ["crates/cairn-core/**", "crates/cairn-tl/**", ".github/workflows/kani.yml"]
  schedule:
    - cron: "0 4 * * *" # nightly re-proof (solver updates can flip results)
  workflow_dispatch: {}

jobs:
  kani:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 27 parallel runners: 5 cairn-core + 22 cairn-tl shards (round-14
      # hardening — see the matrix comments and STATUS.md).
      max-parallel: 27
      matrix:
        harness:
          # ---- cairn-core: cheap shards (pure byte logic, no hashing) ----
          - proof_b64_roundtrip_identity
          - proof_hex_roundtrip_identity
          - proof_sniff_gzip_magic_exact
          # ---- cairn-core: expensive shards (BLAKE3 in the symbolic path) ----
          - proof_commit_roundtrip_frozen_format
          - proof_bloom_probe_math_in_bounds
          # ---- cairn-tl (ADR-0015 §7): classifier totality + interaction
          # symmetry, SHARDED per ours-op-kind (round-14 hardening of the two
          # heavy harnesses that shared-runner preemption used to kill at
          # 50–95 min mid-exploration — never a verification failure, never
          # completed; evidence + history in STATUS.md). Four moves landed:
          # (1) construction stubs for the String/serde_json payloads in
          # bounded_op, (2) PER-KIND SHARDING: ours-kind is a concrete
          # constant per harness, theirs-kind stays symbolic; the union of
          # the 11 shards per family is EXACTLY the original 121-pair space,
          # (3) drop-glue scoping (mem::forget after asserting), (4) the
          # named follow-up proper: #[kani::stub(std::fmt::format, ...)] on
          # every harness (note/fingerprint TEXT is presentation, not the
          # proven property) + branch-valued payloads (Value::Bool(bit),
          # symbolic AttrKind, ""/"x" names) so the classifier's payload
          # equalities resolve as 1-bit/1-byte compares AND the
          # value-differs sub-arms (C1/C2/C3/C8) are covered — run
          # 33844913132 ground >130 min on exactly the three payload-
          # comparing shards (03/06/09) before this. Each shard is a tiny
          # CBMC job — preemption windows no longer matter, so both families
          # are HARD-gated. The classifier LOGIC is additionally pinned by
          # the 89 cairn-tl tests + the 18-file real-timeline corpus gate. ----
          - proof_classifier_shard_kind_00
          - proof_classifier_shard_kind_01
          - proof_classifier_shard_kind_02
          - proof_classifier_shard_kind_03
          - proof_classifier_shard_kind_04
          - proof_classifier_shard_kind_05
          - proof_classifier_shard_kind_06
          - proof_classifier_shard_kind_07
          - proof_classifier_shard_kind_08
          - proof_classifier_shard_kind_09
          - proof_classifier_shard_kind_10
          - proof_symmetry_shard_kind_00
          - proof_symmetry_shard_kind_01
          - proof_symmetry_shard_kind_02
          - proof_symmetry_shard_kind_03
          - proof_symmetry_shard_kind_04
          - proof_symmetry_shard_kind_05
          - proof_symmetry_shard_kind_06
          - proof_symmetry_shard_kind_07
          - proof_symmetry_shard_kind_08
          - proof_symmetry_shard_kind_09
          - proof_symmetry_shard_kind_10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Proof (cairn-core) ${{ matrix.harness }}
        # per-shard unwind: the commit harness compares whole ~95-byte buffers
        # (memcmp model needs >96); bloom's probe loop is concrete-bounded at 16.
        run: >
          cargo kani --harness ${{ matrix.harness }} -p cairn-core
          ${{ matrix.harness == 'proof_commit_roundtrip_frozen_format' && '--default-unwind 104' || '' }}
          ${{ matrix.harness == 'proof_bloom_probe_math_in_bounds' && '--default-unwind 32' || '' }}
        if: contains(matrix.harness, 'b64_') || contains(matrix.harness, 'hex_') || contains(matrix.harness, 'sniff_') || contains(matrix.harness, 'roundtrip_frozen') || contains(matrix.harness, 'bloom_probe')
      - name: Proof (cairn-tl shard) ${{ matrix.harness }}
        # bounded op model: 11 op kinds, fixed structures; unwind 32 covers the
        # model's memcmp (Vec<usize> order compare = 16 bytes; the cairn-core
        # commit shard precedent uses 104 for its ~95-byte buffers).
        # -Z stubbing enables the #[kani::stub] attributes (move 4a/4b) —
        # without the flag the harnesses fail to compile.
        run: cargo kani --harness ${{ matrix.harness }} -p cairn-tl --default-unwind 32 -Z stubbing
        if: contains(matrix.harness, 'shard')
