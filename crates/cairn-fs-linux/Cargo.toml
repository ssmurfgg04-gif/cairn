[package]
name = "cairn-fs-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cairn Linux filesystem integration: FUSE (fuser)"

[dependencies]
cairn-core = { path = "../cairn-core" }
cairn-store = { path = "../cairn-store" }
cairn-sync = { path = "../cairn-sync" }
fuser = { workspace = true, default-features = false, optional = true }
libc = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[features]
fuse = ["dep:fuser"]

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
