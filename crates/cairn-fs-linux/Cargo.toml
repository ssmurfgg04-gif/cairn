[package]
name = "cairn-fs-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cairn Linux filesystem integration: FUSE (fuser)"

[dependencies]
cairn-core = { path = "../cairn-core" }
cairn-store = { path = "../cairn-store" }
cairn-sync = { path = "../cairn-sync" }
fuser = { workspace = true, default-features = false, optional = true }
libc = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[features]
fuse = ["dep:fuser"]

[[bin]]
name = "cairn-fuse"
path = "src/bin/cairn-fuse.rs"
required-features = ["fuse"]

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }


