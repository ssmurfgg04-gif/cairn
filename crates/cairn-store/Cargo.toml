[package]
name = "cairn-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cairn local store: chunk CAS + client SQLite (WAL) + outbox + header cache"

[dependencies]
cairn-core = { path = "../cairn-core" }
# async file lane for CAS reads (ADR-0025): tokio::fs routes through the
# io_uring driver when armed (tokio `io-uring` feature, Linux, probed)
tokio = { workspace = true }
# r2d2 reader pool for the header cache (ADR-0025): 0.25.x is the line built
# against our rusqlite 0.32 — keeps a single rusqlite crate in the graph
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
windows-core = "0.58"

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }


