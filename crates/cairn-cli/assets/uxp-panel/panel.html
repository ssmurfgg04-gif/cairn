<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cairn markers</title>
<style>
/* cairn markers panel — the dark-studio language (ADR-0021 tokens, panel
   scale): warm near-black, one amber accent, hairlines, tabular TC. */
:root {
  --bg: #141312;
  --panel: #1b1917;
  --panel-2: #201d1a;
  --line: rgba(255, 255, 255, 0.08);
  --line-2: rgba(255, 255, 255, 0.16);
  --ink: #f2ede3;
  --ink-2: #b5aea4;
  --ink-3: #8a8580;
  --accent: #ffd76a;
  --ok: #35c07f;
  --bad: #f2555a;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, Menlo, monospace;
  --sans: "DM Sans", "Segoe UI", -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 12.5px; }
body { padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 10px; min-height: 100vh; }
[hidden] { display: none !important; }

.brand { display: flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
.brand .word { font-weight: 700; letter-spacing: -0.02em; font-size: 13.5px; }
.brand .word span { color: var(--ink-3); font-weight: 500; margin-left: 5px; font-size: 11px; }
.status { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink-3); white-space: nowrap; }
.status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); margin-right: 4px; }
.status.ok .dot { background: var(--ok); }

.row { display: flex; gap: 6px; align-items: center; }
select, button {
  font: inherit; font-size: 11.5px; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px;
  padding: 5px 9px; cursor: pointer;
}
select { flex: 1; min-width: 0; }
button:hover { border-color: rgba(255, 215, 106, 0.45); }
button.primary { background: var(--accent); border-color: var(--accent); color: #141312; font-weight: 600; }
button:disabled { opacity: 0.45; cursor: default; }

.markers { flex: 1; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
th { text-align: left; color: var(--ink-3); font-family: var(--sans); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; padding: 7px 9px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
td { padding: 6px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.tc { color: var(--accent); white-space: nowrap; }
td.frame { color: var(--ink-3); text-align: right; }
td.author { color: var(--ink-2); font-family: var(--sans); white-space: nowrap; }
td.note { font-family: var(--sans); color: var(--ink); }
td.status-c { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; }
td.status-c.OPEN { color: var(--accent); }
td.status-c.RESOLVED { color: var(--ok); }
td.status-c.REJECTED { color: var(--bad); }

.note-line { font-size: 11px; color: var(--ink-3); min-height: 15px; }
.note-line.err { color: var(--bad); }
.empty { padding: 26px 12px; text-align: center; color: var(--ink-3); font-size: 11.5px; }

.actions { display: flex; gap: 6px; }
.actions button { flex: 1; }
</style>
</head>
<body>
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="9" y="3.5" width="6" height="4" rx="1.2" fill="#ffd76a" opacity="0.55"/>
      <rect x="6.5" y="9" width="11" height="4" rx="1.2" fill="#ffd76a" opacity="0.75"/>
      <rect x="3.5" y="14.5" width="17" height="4" rx="1.2" fill="#f2ede3" opacity="0.95"/>
    </svg>
    <span class="word">cairn<span>markers</span></span>
    <span class="status" id="status"><span class="dot"></span><span id="status-text">connecting…</span></span>
  </div>

  <div class="row">
    <select id="project" aria-label="project"></select>
    <select id="version" aria-label="version" style="flex:none; width:110px"></select>
    <button id="refresh" title="reload from the daemon">&#8635;</button>
  </div>

  <div class="markers" id="markers">
    <div class="empty" id="empty">no version selected</div>
    <table hidden>
      <thead><tr><th class="frame">frame</th><th>tc</th><th>who</th><th>state</th><th>note</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="actions">
    <button class="primary" id="export-fcpxml" disabled>FCP7 XML</button>
    <button id="export-otio" disabled>OTIO</button>
    <button id="export-csv" disabled>CSV</button>
  </div>
  <div class="note-line" id="note"></div>

<script src="panel.js"></script>
<div class="live-box" id="live-box" hidden>
  <div class="live-head">
    <span class="live-title">LIVE PRESENCE</span>
    <span class="live-me" id="live-me">—</span>
  </div>
  <ul class="live-list" id="live-list"></ul>
</div>
<style>
.live-box { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 8px 10px; }
.live-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.live-title { font-size: 9.5px; letter-spacing: 0.1em; color: var(--ink-3); text-transform: uppercase; font-weight: 700; }
.live-me { font-family: var(--mono); font-size: 10px; color: var(--accent); margin-left: auto; }
.live-list { list-style: none; }
.live-list li { display: flex; gap: 8px; align-items: baseline; font-size: 11px; padding: 3px 0; font-family: var(--mono); }
.live-list .who { font-family: var(--sans); color: var(--ink); min-width: 90px; }
.live-list .tc { color: var(--accent); }
.live-list .act { color: var(--ink-3); font-size: 9.5px; }
.live-note { font-size: 10px; color: var(--ink-3); font-family: var(--sans); }
</style>
</body>
</html>
