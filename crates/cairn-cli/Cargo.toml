[package]
name = "cairn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cairn CLI + local daemon (ctl gRPC :17777, local dashboard :17778)"

[[bin]]
name = "cairn"
path = "src/main.rs"

[dependencies]
cairn-tl = { path = "../cairn-tl" }
cairn-core = { path = "../cairn-core" }
cairn-p2p = { path = "../cairn-p2p" }
cairn-store = { path = "../cairn-store" }
cairn-fs-win = { path = "../cairn-fs-win" }
cairn-sync = { path = "../cairn-sync" }
cairn-proto = { path = "../cairn-proto" }
cairn-server = { path = "../cairn-server" }
cairn-shell-ext = { path = "../cairn-shell-ext" }
cairn-review = { path = "../cairn-review" }
cairn-proxy = { path = "../cairn-proxy" }
tonic = { workspace = true }
prost = { workspace = true }
async-trait = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio = { workspace = true }
clap = { workspace = true }
# Global allocator (ADR-0026, Johal's 1.85 memory round): mimalloc's
# per-thread heaps + 8B header beat the system allocator on exactly our
# shape — many small allocations across worker threads (presence, notes,
# SQLite rows) with 128B-class payloads.
mimalloc = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
dirs = "5"
keyring = { workspace = true }
once_cell = "1"
rustls = { workspace = true }

[target.'cfg(windows)'.dependencies]
# round 27 "attach just works": the dashboard's native folder picker
# (SHBrowseForFolderW — the SAME legacy dialog the tray ships, no COM
# apartment juggling) — the user's first instinct on the attach scene
# is to CLICK, not to type a path. Same windows crate line as the
# other crates (0.58), only the shell/com features added.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
cairn-server = { path = "../cairn-server" }
prost = { workspace = true }
tokio-stream = "0.1"
sqlx = { workspace = true }


