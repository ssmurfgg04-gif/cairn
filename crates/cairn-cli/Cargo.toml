[package]
name = "cairn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cairn CLI + local daemon (ctl gRPC :17777, local dashboard :17778)"

[[bin]]
name = "cairn"
path = "src/main.rs"

[dependencies]
cairn-tl = { path = "../cairn-tl" }
cairn-core = { path = "../cairn-core" }
cairn-store = { path = "../cairn-store" }
cairn-fs-win = { path = "../cairn-fs-win" }
cairn-sync = { path = "../cairn-sync" }
cairn-proto = { path = "../cairn-proto" }
cairn-server = { path = "../cairn-server" }
tonic = { workspace = true }
prost = { workspace = true }
tokio-stream = "0.1"
tokio = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
dirs = "5"
keyring = { workspace = true }
once_cell = "1"
rustls = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
cairn-server = { path = "../cairn-server" }
prost = { workspace = true }
tokio-stream = "0.1"
sqlx = { workspace = true }


