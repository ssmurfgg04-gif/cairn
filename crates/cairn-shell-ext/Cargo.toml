[package]
name = "cairn-shell-ext"
description = "Windows Explorer shell extension for cairn: overlay icons (Synced/Conflict/Fetching/Pinned) + context-menu actions (Lock File / Unlock / Create Snapshot). The state model and command construction are cross-platform and unit-tested; the COM surface is cfg(windows)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dev-dependencies]
tempfile = { workspace = true }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Registry",
] }
