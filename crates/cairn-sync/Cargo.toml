[package]
name = "cairn-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cairn sync engine: state machine, AIMD uploader, conflict copies, cursor replay"

[dependencies]
cairn-core = { path = "../cairn-core" }
blake3 = { workspace = true }
cairn-store = { path = "../cairn-store" }
cairn-proto = { path = "../cairn-proto" }
# CONTRACT-DEBT #1: the CONFLICT arm offers a semantic merge of timeline
# conflicts. cairn-tl is pure (no I/O, forbid(unsafe_code)) — safe here.
cairn-tl = { path = "../cairn-tl" }
tonic = { workspace = true }
tokio = { workspace = true }
# CPU offload lane (ADR-0025): rayon::spawn + oneshot, PostHog pattern
rayon = { workspace = true }
prost = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
flate2 = "1"
hex = { workspace = true }
rand = { workspace = true }
notify = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
rusqlite = { workspace = true }
num_cpus = "1.16"

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
# sweep tests must restore mtimes after in-place edits (size+mtime-preserving divergence)
filetime = "0.2"
# merge_offer tests build real OTIO fixtures (stamp() gives elements stable ids)
uuid = { workspace = true }
# merge_offer tests parse the MergeReport::to_json rows
serde_json = { workspace = true }


