[package]
name = "cairn-fs-win"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cairn cairn-fs-win"

[dependencies]
cairn-core = { path = "../cairn-core" }
blake3 = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_CorrelationVector",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Security",
] }
windows-core = "0.58"


[features]
cfapi = []

[[bin]]
name = "cfapi-hydration-probe"
path = "src/bin/hydration_probe.rs"
required-features = []

[[bin]]
name = "cfapi-write-probe"
path = "src/bin/write_probe.rs"
required-features = []

[lints]
workspace = true
