[package]
name = "cairn-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cairn system tray (Windows): thin onboarding layer over cairn-cli — connect, status, open, disconnect. No engine linkage (ADR-0016)."

[[bin]]
name = "cairn-tray"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }

[lints]
workspace = true
