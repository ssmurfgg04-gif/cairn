# nginx TLS termination for the Cairn meeting point — the TCP leg only.
#
# Companion: docs/runbook-meeting-point.md (§TLS) + deploy/docker-compose.yml.
#
# WHAT THE SERVER SPEAKS (verified against crates/cairn-server/src/run.rs):
#   7443/tcp  gRPC (tonic, HTTP/2, plaintext in shape A)  -> proxied here
#   7444/tcp  dev local-fs objects HTTP endpoint          -> see the caveat
#   17780/udp signal directory, 17781/udp relay (+QUIC)   -> NOT proxied here
#
# WHY THE UDP LEGS ARE NOT PROXIED (honest, not laziness): the swarm signal
# protocol authenticates and canonicalizes peers by the OBSERVED SOURCE
# ADDRESS of each datagram (crates/cairn-p2p/src/signal.rs — a relay
# announcing 0.0.0.0:17781 is published as the address the registration
# datagram actually came from). Any UDP proxy rewrites the source to the
# proxy, which poisons every candidate and breaks NAT discovery. (The
# library's QUIC relay leg — cairn-quic, relay.rs `spawn_with_quic` — is
# likewise UDP when it ships; `cairn signal` serves the UDP relay today.)
# Therefore:
# the proxy sample covers the TCP leg only; the UDP legs MUST be exposed
# directly by the host/firewall:
#
#   ufw allow 17780/udp && ufw allow 17781/udp        # ubuntu ufw
#   firewall-cmd --add-port=17780/udp --permanent     # firewalld
#   firewall-cmd --add-port=17781/udp --permanent && firewall-cmd --reload
#
# Client-facing contract after this proxy: editors log in with
#   cairn login --server https://cairn.example.com --code enr-... --name box1
# (https scheme => TLS; a Let's Encrypt chain validates against the client's
# webpki roots with no --ca flag — crates/cairn-sync/src/plane_grpc.rs).

# ---- TLS server for the metadata plane (gRPC over h2) ---------------------
server {
    listen 443 ssl;
    http2 on;                          # gRPC requires h2 (nginx >= 1.25.1)
    server_name cairn.example.com;     # YOUR meeting-point DNS name

    # certbot live path (adjust if you keep certs elsewhere; the compose
    # file mounts ./certs here)
    ssl_certificate     /etc/nginx/certs/live/cairn.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/cairn.example.com/privkey.pem;

    # modern-only clients; cairn's rustls client is TLS1.3/1.2 capable
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Chunk uploads/downloads stream through long-lived gRPC calls:
    # do NOT cap request bodies (chunks are 16MB-class but sessions stream),
    # and raise the timeouts well past the longest sync stall.
    client_max_body_size 0;
    grpc_read_timeout   3600s;
    grpc_send_timeout   3600s;
    # gRPC is not a "location /webapp": pass EVERYTHING on this vhost.
    location / {
        grpc_pass grpc://cairn-server:7443;   # compose service name
        # co-located (proxy installed beside a systemd cairn-server):
        # grpc_pass grpc://127.0.0.1:7443;
    }

    # gRPC clients ignore error pages; make failures legible in the logs
    add_header X-Cairn-Proxy "grpc" always;
}

# ---- ACME + redirect ------------------------------------------------------
server {
    listen 80;
    server_name cairn.example.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- the dev objects endpoint: honest caveat ------------------------------
# 7444 serves the DEV local-fs object store and signs URLs with a base URL
# that is hardcoded to http:// (crates/cairn-server/src/storage.rs —
# `format!("http://{}/", objects_addr)`), so presigned PUT/GETs are plaintext
# HTTP BY CONSTRUCTION on this backend. For production media, configure a
# real S3-compatible bucket (CAIRN_S3_* env — served over HTTPS by the
# bucket vendor, ADR-0005); that is the supported shape and no 7444 proxy is
# needed at all. If you must run local-fs on a trusted private network, expose
# 7444 on the private interface directly; do not pretend a proxy fixes the
# scheme baked into the signed URLs.
