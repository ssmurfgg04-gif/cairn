[workspace]
resolver = "2"
members = [
    "crates/cairn-proto",
    "crates/cairn-core",
    "crates/cairn-store",
    "crates/cairn-sync",
    "crates/cairn-server",
    "crates/cairn-cli",
    "crates/cairn-sim",
    "crates/cairn-fs-linux",
    "crates/cairn-fs-mac",
    "crates/cairn-fs-win",
    "crates/cairn-x",
]
exclude = ["crates/cairn-x/fuzz"]

[workspace.package]
version = "4.0.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
# async runtime / gRPC / HTTP
tokio = { version = "1.40", features = ["full"] }
tonic = { version = "0.12", features = ["transport", "codegen", "prost", "tls"] }
prost = "0.13"
axum = { version = "0.7", features = ["http1", "json", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1"

# storage
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
memmap2 = "0.9"

# hashing / chunking / compression
blake3 = "1"
zstd = "0.13"

# ids / serialization
uuid = { version = "1", features = ["v7", "v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# crypto / auth
hmac = "0.12"
sha2 = "0.10"
pasetors = "0.6"
keyring = "3"

# s3-compatible buckets (SigV4 presign + signed REST; ADR-0005)
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

# fs / platform
notify = "6"
fuser = { version = "0.14", default-features = false }
unicode-normalization = "0.1"
libc = "0.2"

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# cli
clap = { version = "4", features = ["derive", "env"] }

# testing
proptest = "1"
tempfile = "3"
rand = "0.8"

# proto build
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "3"

[profile.dev]
debug = false
incremental = false

[profile.test]
debug = false

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[workspace.lints.rust]
unsafe_code = "deny"
# `cfg(kani)` gates the BMC harnesses (crates/cairn-core/src/proofs.rs) — set by the
# Kani driver, invisible to normal rustc without this declaration (WO6-invariants).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# curated allow-list: engine-specific or noise (documented in docs/STATUS.md)
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
result_large_err = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
unnested_or_patterns = "allow"
map_unwrap_or = "allow"
items_after_statements = "allow"
redundant_closure_for_method_calls = "allow"
unused_self = "allow"
single_match_else = "allow"
option_if_let_else = "allow"
default_trait_access = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
match_same_arms = "allow"
manual_let_else = "allow"
explicit_iter_loop = "allow"
uninlined_format_args = "allow"
identity_op = "allow"
double_must_use = "allow"
format_push_string = "allow"
too_many_arguments = "allow"
manual_is_multiple_of = "allow"
bool_to_int_with_if = "allow"
assigning_clones = "allow"
unreadable_literal = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
manual_clamp = "allow"
neg_multiply = "allow"
