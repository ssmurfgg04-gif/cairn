[workspace]
resolver = "2"
members = [
    "crates/cairn-proto",
    "crates/cairn-core",
    "crates/cairn-p2p",
    "crates/cairn-store",
    "crates/cairn-sync",
    "crates/cairn-server",
    "crates/cairn-cli",
    "crates/cairn-sim",
    "crates/cairn-fs-linux",
    "crates/cairn-fs-mac",
    "crates/cairn-fs-win",
    "crates/cairn-x",
    "crates/cairn-tl",
    "crates/cairn-tray",
    "crates/cairn-shell-ext",
    "crates/cairn-review",
    "crates/cairn-proxy",
]
exclude = ["crates/cairn-x/fuzz", "crates/cairn-app"]

[workspace.package]
version = "4.0.0"
edition = "2021"
license = "Apache-2.0"
# 1.85 floor (from 1.80): modern toolchains carry the compiler-side wins the
# devx round documents (cheaper wakers, faster incr-comp); the toolchain pin
# lives in rust-toolchain.toml (1.98.0) and CI pins per-job.
rust-version = "1.85"

[workspace.dependencies]
# async runtime / gRPC / HTTP
# `io-uring` (ADR-0025): tokio's io_uring driver — Linux-only, UNSTABLE, gated
# behind `--cfg tokio_unstable` which .cargo/config.toml sets for every build.
# Runtime-probed with automatic fallback (epoll/ threadpool) on kernels/runtimes
# without ring support. Requires tokio >= 1.53 for the feature; Cargo.lock pins 1.53.1.
tokio = { version = "1.40", features = ["full", "io-uring"] }
# CPU offload lane (ADR-0025, PostHog pattern): hashing/chunking runs on rayon
# via spawn+oneshot so tokio I/O workers never park on CPU work.
rayon = "1.10"
# Global allocator swap (ADR-0026): per-thread heaps, 8B header, NUMA-aware.
# johal.in/internals-rust-185-memory-allocator: 42ns vs 68ns at 128B,
# p99 89ns vs 142ns (38%), and — the quiet killer — 12-week heap
# fragmentation 20.7% vs jemalloc-style 67%: a long-lived daemon stops
# bleeding RSS to fragmentation. Bind in cairn-cli's main.rs (the shipped
# binary: CLI + daemon + server in one).
mimalloc = "0.1"
tonic = { version = "0.12", features = ["transport", "codegen", "prost", "tls"] }
prost = "0.13"
axum = { version = "0.7", features = ["http1", "json", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1"

# storage
rusqlite = { version = "0.32", features = ["bundled"] }
# r2d2 reader pool (ADR-0025): 0.25.x is the release line built against OUR
# rusqlite 0.32 — a version mismatch would duplicate the rusqlite crate and
# break the PooledConnection<->Connection type identity.
r2d2 = "0.8"
r2d2_sqlite = "0.25"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
memmap2 = "0.9"

# hashing / chunking / compression
blake3 = "1"
zstd = "0.13"

# ids / serialization
uuid = { version = "1", features = ["v7", "v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# crypto / auth
hmac = "0.12"
sha2 = "0.10"
pasetors = "0.6"
keyring = "3"

# s3-compatible buckets (SigV4 presign + signed REST; ADR-0005)
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

# fs / platform
notify = "6"
fuser = { version = "0.14", default-features = false }
unicode-normalization = "0.1"
libc = "0.2"

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# cli
clap = { version = "4", features = ["derive", "env"] }

# testing
proptest = "1"
tempfile = "3"
rand = "0.8"

# proto build
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "3"

[profile.dev]
# compile-speed-first dev profile (devx round, top-10 #5): opt-level 0 (default),
# no debug info (fast links), incremental ON for the edit-build loop. CI pins
# CARGO_INCREMENTAL=0 (ci.yml env) where determinism + cache-ability win.
debug = false
incremental = true

[profile.test]
debug = false

[profile.release]
# runtime + size tuned (devx top-10 #5): fat LTO + codegen-units=1 trade release
# build time for cross-crate optimization; `strip` cuts ~30% of the binary;
# `panic = "abort"` drops unwind tables (cargo forces unwind for test/bench
# profiles, so `cargo test` — incl. `--release` — is unaffected; release
# DOCTESTS are the one unsupported combination; CI never runs them).
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_code = "deny"
# `cfg(kani)` gates the BMC harnesses (crates/cairn-core/src/proofs.rs) — set by the
# Kani driver, invisible to normal rustc without this declaration (WO6-invariants).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(tokio_unstable)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# curated allow-list: engine-specific or noise (documented in docs/STATUS.md)
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
result_large_err = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
unnested_or_patterns = "allow"
map_unwrap_or = "allow"
items_after_statements = "allow"
redundant_closure_for_method_calls = "allow"
unused_self = "allow"
single_match_else = "allow"
option_if_let_else = "allow"
default_trait_access = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
match_same_arms = "allow"
manual_let_else = "allow"
explicit_iter_loop = "allow"
uninlined_format_args = "allow"
identity_op = "allow"
double_must_use = "allow"
format_push_string = "allow"
too_many_arguments = "allow"
manual_is_multiple_of = "allow"
bool_to_int_with_if = "allow"
assigning_clones = "allow"
unreadable_literal = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
manual_clamp = "allow"
neg_multiply = "allow"

